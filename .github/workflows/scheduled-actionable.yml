name: Scheduled Actionable Docs Checks

# Phase 8 contract (DO NOT BREAK):
# - This workflow runs `npm run check:parity` with NO scope filters
#   (no --slug, no --section). It is the ONLY workflow that calls
#   sync-detection-issues.cjs to update the 4 managed detection
#   issues (snapshot-diff, parity-regression, source-sync-health,
#   parity-followup).
# - Adding --slug or --section here would emit a partial-run
#   docs-actionable-report.json. The Phase 8 PR2 partial-run guard in
#   sync-detection-issues.cjs would then refuse to sync, and the
#   managed issues would silently stop updating.
# - For per-section / per-slug debugging, use deep-audit.yml. That
#   workflow intentionally does NOT call sync-detection-issues.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */3 * *'

permissions:
  contents: read
  issues: write

jobs:
  scheduled-actionable:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh sidebar seed
        run: npm run docs:sync-sidebar

      - name: Fetch and diff snapshots
        id: snapshots
        run: npm run check:snapshots
        continue-on-error: true

      - name: Check source parity (local)
        id: parity_local
        run: npm run check:parity
        continue-on-error: true

      - name: Generate detection summary (strict)
        # §2 fail-closed: --strict makes loadDetectionInputs validate
        # snapshot-diff-status.json, parity-check-status.json, and (when
        # present) source-sync-status.json against their schemaVersion
        # contracts BEFORE writing docs-actionable-report.json. Any
        # validation error fails this step, which then blocks the sync
        # step below via its `steps.summary.outcome` precondition.
        id: summary
        run: npm run check:summary -- --strict
        continue-on-error: true

      - name: Publish step summary
        if: always() && hashFiles('docs-update-summary.md') != ''
        run: cat docs-update-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Report check outcomes
        if: always()
        run: |
          if [ "$SNAPSHOTS_OUTCOME" = "failure" ]; then
            echo "::warning::Snapshot fetch/diff reported issues (exit code non-zero)"
          fi
          if [ "$PARITY_OUTCOME" = "failure" ]; then
            echo "::warning::Parity check reported issues (exit code non-zero)"
          fi
          if [ "$SUMMARY_OUTCOME" = "failure" ]; then
            echo "::error::Detection input validation failed — sync will be skipped"
            {
              echo "## ❌ Detection input validation failed"
              echo ""
              echo "Strict --strict validation rejected one or more of:"
              echo "- snapshot-diff-status.json"
              echo "- parity-check-status.json"
              echo "- source-sync-status.json (when present)"
              echo ""
              echo "Managed detection issues will NOT be synced from this run."
              echo "Inspect the artifact bundle and the previous step logs."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          SNAPSHOTS_OUTCOME: ${{ steps.snapshots.outcome }}
          PARITY_OUTCOME: ${{ steps.parity_local.outcome }}
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}

      - name: Upload detection artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-actionable-artifacts
          path: |
            source-sync-status.json
            snapshot-diff-status.json
            parity-check-status.json
            docs-actionable-report.json
            docs-update-summary.md
            docs-audit-manifest.json
            docs/SIDEBAR_URLS.md
          retention-days: 30

      - name: Sync detection issues
        # §2 fail-closed: only sync when ALL of:
        #   1. This is a scheduled run (manual dispatches don't sync)
        #   2. The strict summary step exited 0 (artifacts validated)
        #   3. docs-actionable-report.json was actually written
        # The sync script ALSO refuses partial-run reports via runScope
        # (Phase 8 PR2 guard). These are layered defenses.
        if: |
          github.event_name == 'schedule'
          && steps.summary.outcome == 'success'
          && hashFiles('docs-actionable-report.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const syncDetectionIssues = require('./.github/scripts/sync-detection-issues.cjs');
            await syncDetectionIssues({
              github,
              context,
              core,
              reportPath: 'docs-actionable-report.json',
            });

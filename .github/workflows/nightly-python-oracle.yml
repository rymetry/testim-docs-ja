name: Python oracle snapshot (nightly)

# Phase 6b cutover 以降の nightly schedule:
#
# 1. ``oracle-snapshot`` — Python ``emit_corpus_oracle`` で live JSONL を生成し、
#    committed golden と byte-identical 比較する drift gate。mjs は削除済みなので
#    emit は Python 実装に切替。Python 実装が committed golden と drift するのは
#    Python 側 segments_en / turndown / align の挙動が変わったときのみで、
#    main merge 後の silent drift を 24 時間以内に検知する safety net として機能。
#
# 2. ``parity-smoke`` — Python ``check_source_parity`` full-repo smoke (~19 分)。
#    required CI だと feedback loop 破綻なので nightly 移設。cutover marker は
#    Phase 6b merge 後は 0 slug 維持される前提なので通常含めない。
#
# 3. ``python-quality-full`` — ``recall`` / ``boundary`` / ``real_repo`` marker の
#    full-repo benchmark。PR CI (python-fast) の scope 外で、毎日 1 回 run する。
#
# 本 workflow の run: は静的 command のみで untrusted input を一切参照しない。

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle-snapshot:
    # Python-based nightly oracle drift safety net (Phase 6b cutover 後の新設計)。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/python
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: scripts/python/.python-version
      - name: Install uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6
        with:
          version: '0.11.7'
          enable-cache: true
          cache-dependency-glob: 'scripts/python/uv.lock'
      - name: Sync Python deps
        run: uv sync --locked --all-extras
      - name: Generate today's oracle JSONL
        # Python 実装で 3 suite (segments_en + turndown + align) 全て生成。
        run: |
          uv run python -m testim_parity.tools.emit_corpus_oracle --out .oracle_today.jsonl
          wc -l .oracle_today.jsonl
      - name: Extract sha256 summary
        run: uv run python -m testim_parity.tools.summarize_corpus_oracle --in .oracle_today.jsonl --out .oracle_sha256.tsv
      - name: Diff live oracle + sha256 TSV against committed golden
        # 2 段階 drift gate (PR CI python-corpus の二重化 safety net):
        #   Step 1: Python live JSONL vs committed JSONL
        #   Step 2: summarize(committed JSONL) vs committed sha256 TSV
        # PR を経由しない直接 push 等での drift を拾う。
        run: |
          GOLDEN_JSONL=tests/conformance/__oracle__/corpus_golden.jsonl
          GOLDEN_TSV=tests/conformance/__oracle__/corpus_golden.sha256.tsv

          # Step 1: live Python JSONL vs committed JSONL
          if ! diff -q .oracle_today.jsonl "$GOLDEN_JSONL"; then
            echo ""
            echo "::error::Nightly oracle drift: Python live output != committed golden JSONL."
            echo "Regenerate via (from repo root):"
            echo "  npm run test:py:corpus:regen"
            exit 1
          fi

          # Step 2: committed JSONL の hash と committed TSV が一致するか
          uv run python -m testim_parity.tools.summarize_corpus_oracle --in "$GOLDEN_JSONL" --out .oracle_committed_expected.tsv
          if ! diff -q .oracle_committed_expected.tsv "$GOLDEN_TSV"; then
            echo ""
            echo "::error::Nightly oracle TSV drift: committed JSONL hashes != committed TSV."
            echo "Regenerate via (from repo root):"
            echo "  npm run test:py:corpus:regen"
            exit 1
          fi
      - name: Upload today's oracle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-oracle-jsonl
          path: |
            scripts/python/.oracle_today.jsonl
            scripts/python/.oracle_sha256.tsv
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  parity-smoke:
    # Phase 6b cutover 後も required CI へ昇格させず nightly 維持する scope
    # (python-fast と coverage / runtime を分ける設計)。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/python
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: scripts/python/.python-version
      - name: Install uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6
        with:
          version: '0.11.7'
          enable-cache: true
          cache-dependency-glob: 'scripts/python/uv.lock'
      - name: Sync Python deps
        run: uv sync --locked --all-extras
      - name: pytest (parity_smoke)
        # Phase 6b cutover 後は cutover marker の 5-counter gate は green 維持が
        # 前提 (new drift は発生時に parser / content 側で解決する規律)。本 job
        # では parity_smoke のみに絞る。
        run: uv run pytest -m 'parity_smoke and not cutover' --tb=short --durations=10

  python-quality-full:
    # recall / boundary / real_repo marker の full-repo benchmark。Phase 6b
    # cutover 後も node 不要で動く (segments_en / segments_ja / align は Python
    # 完結)。将来 ``test_recall`` を parametrize + xdist で並列化する improvement は
    # Phase 6b 以降の別 PR で行う。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/python
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: scripts/python/.python-version
      - name: Install uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6
        with:
          version: '0.11.7'
          enable-cache: true
          cache-dependency-glob: 'scripts/python/uv.lock'
      - name: Sync Python deps
        run: uv sync --locked --all-extras
      - name: pytest (recall + boundary + real_repo)
        run: uv run pytest -m 'recall or boundary or real_repo' --tb=short --durations=30

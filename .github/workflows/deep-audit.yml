name: Deep Audit Docs Checks

# Workflow split contract (DO NOT BREAK):
# - This workflow runs `npm run check:parity` with optional --section
#   filtering for ad-hoc debugging. It is intentionally manual-only
#   (workflow_dispatch) and MUST NOT call sync-detection-issues.cjs.
# - Partial runs produce a docs-actionable-report.json whose
#   runScope.isComplete is false. The partial-run guard in
#   sync-detection-issues.cjs would refuse the sync if you wired it
#   in here, but please do not rely on the guard alone — keep the
#   sync call out of this file. The audit-only signals
#   (paragraph-count-mismatch, heading-mismatch, table-cell-* etc.)
#   are visible in the artifacts uploaded below for human review.
# - Managed issue updates always come from scheduled-actionable.yml.

on:
  workflow_dispatch:
    inputs:
      section:
        description: Optional section or path filter
        required: false
        type: string

permissions:
  contents: read

jobs:
  deep-audit:
    runs-on: ubuntu-latest
    env:
      SECTION_FILTER: ${{ inputs.section }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh sidebar seed
        run: npm run docs:sync-sidebar

      - name: Fetch and diff snapshots
        id: snapshots
        run: |
          set +e
          if [ -n "$SECTION_FILTER" ]; then
            npm run check:snapshots -- --section="$SECTION_FILTER"
          else
            npm run check:snapshots
          fi
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Check source parity (local)
        id: parity_local
        run: |
          set +e
          if [ -n "$SECTION_FILTER" ]; then
            npm run check:parity -- --section="$SECTION_FILTER"
          else
            npm run check:parity
          fi
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate detection summary
        run: npm run check:summary

      - name: Publish step summary
        if: always() && hashFiles('docs-update-summary.md') != ''
        run: cat docs-update-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-audit-artifacts
          path: |
            snapshot-diff-status.json
            parity-check-status.json
            docs-actionable-report.json
            docs-update-summary.md
            docs-audit-manifest.json
            docs/SIDEBAR_URLS.md
          retention-days: 30

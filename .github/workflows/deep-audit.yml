name: Deep Audit Docs Checks

on:
  workflow_dispatch:
    inputs:
      section:
        description: Optional section or path filter
        required: false
        type: string

permissions:
  contents: read

jobs:
  deep-audit:
    runs-on: ubuntu-latest
    env:
      SECTION_FILTER: ${{ inputs.section }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh sidebar seed
        run: npm run docs:sync-sidebar

      - name: Check for outdated documentation
        id: updates
        run: |
          set +e
          if [ -n "$SECTION_FILTER" ]; then
            npm run check:updates -- --section="$SECTION_FILTER"
          else
            npm run check:updates
          fi
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Check source parity (remote full report)
        id: parity_remote
        run: |
          set +e
          if [ -n "$SECTION_FILTER" ]; then
            npm run check:parity:remote -- --section="$SECTION_FILTER"
          else
            npm run check:parity:remote
          fi
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate detection summary
        run: npm run check:summary

      - name: Publish step summary
        if: always() && hashFiles('docs-update-summary.md') != ''
        run: cat docs-update-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-audit-artifacts
          path: |
            docs-update-status.json
            parity-check-status.json
            docs-actionable-report.json
            docs-update-summary.md
            docs-audit-manifest.json
            docs/SIDEBAR_URLS.md
          retention-days: 30

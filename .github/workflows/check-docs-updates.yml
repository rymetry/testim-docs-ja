name: Check Documentation Updates

on:
  # pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */3 * *'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint docs
        run: npm run lint:docs

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  check-updates:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Refresh sidebar seed
        run: npm run docs:sync-sidebar
      
      - name: Check for outdated documentation
        id: check
        run: |
          set +e
          npm run check:updates
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "outdated_found=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Check source parity (local)
        id: parity
        run: |
          set +e
          npm run check:parity
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "parity_issues=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-update-status
          path: |
            docs-update-status.json
            parity-check-status.json
            docs/SIDEBAR_URLS.md
          retention-days: 30
      
      - name: Create issue if outdated
        if: (steps.check.outputs.outdated_found == 'true' || steps.parity.outputs.parity_issues == 'true') && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const status = JSON.parse(fs.readFileSync('docs-update-status.json', 'utf8'));
            
            const outdated = status.files.filter(f => f.needsUpdate);
            
            let body = '## 📋 英語原文が更新されたドキュメントが見つかりました\n\n';
            body += `チェック日時: ${status.checkedAt}\n\n`;
            body += '### 📊 サマリー\n\n';
            body += `- ✅ 最新: ${status.summary.upToDate}件\n`;
            body += `- ❌ 更新必要: ${status.summary.outdated}件\n`;
            body += `- ⚠️ エラー: ${status.summary.errors}件\n\n`;
            
            if (outdated.length > 0) {
              body += '### ❌ 更新が必要なファイル\n\n';
              outdated.forEach(item => {
                body += `#### \`${item.file}\`\n\n`;
                body += `- 日本語版: ${item.japaneseUpdated}\n`;
                body += `- 英語原文: ${item.englishUpdated}\n`;
                body += `- 遅延: ${item.daysBehind}日\n`;
                body += `- URL: ${item.sourceUrl}\n\n`;
              });
            }
            
            // Source parity チェック結果を追加
            if (fs.existsSync('parity-check-status.json')) {
              const parity = JSON.parse(fs.readFileSync('parity-check-status.json', 'utf8'));
              if (parity.summary.filesWithIssues > 0) {
                body += '### 🔍 Source parity チェック結果\n\n';
                body += `- 問題ありファイル: ${parity.summary.filesWithIssues}件\n`;
                for (const [type, count] of Object.entries(parity.summary.issuesByType)) {
                  body += `  - ${type}: ${count}件\n`;
                }
                body += '\n詳細は Artifact の `parity-check-status.json` を参照してください。\n\n';
              }
            }

            body += '\n---\n';
            body += '自動生成: GitHub Actions ([check-docs-updates.yml](.github/workflows/check-docs-updates.yml))';
            
            // 既存のissueを検索
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'documentation,update-needed'
            });
            
            const existingIssue = issues.data.find(issue => 
              issue.title.includes('英語原文が更新されたドキュメント')
            );
            
            if (existingIssue) {
              // 既存のissueを更新
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `## 🔄 更新チェック結果（${new Date().toISOString().split('T')[0]}）\n\n${body}`
              });
            } else {
              // 新しいissueを作成
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '📋 英語原文が更新されたドキュメントがあります',
                body: body,
                labels: ['documentation', 'update-needed', 'automated']
              });
            }
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            if (!fs.existsSync('docs-update-status.json')) {
              return;
            }
            
            const status = JSON.parse(fs.readFileSync('docs-update-status.json', 'utf8'));
            const outdated = status.files.filter(f => f.needsUpdate);
            
            if (outdated.length === 0) {
              return;
            }
            
            let body = '## 📋 ドキュメント更新状況\n\n';
            body += `このPRに含まれるファイルのうち、英語原文が更新されているものがあります：\n\n`;
            
            outdated.slice(0, 5).forEach(item => {
              body += `- \`${item.file}\`: ${item.japaneseUpdated} → ${item.englishUpdated} (${item.daysBehind}日遅れ)\n`;
            });
            
            if (outdated.length > 5) {
              body += `\n...他 ${outdated.length - 5}件\n`;
            }
            
            body += '\n詳細は[Artifactをダウンロード]してご確認ください。';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

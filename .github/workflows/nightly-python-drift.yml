name: Python drift (nightly)

# Nightly schedule: mjs oracle の self-regression を検出する。Phase 5
# coexistence 中は mjs harness 出力を **前日に commit された expected/golden**
# と比較し、oracle 自体が drift していないかを確認する。Phase 6a golden-freeze
# PR で mjs oracle vs committed golden fixture 比較を **必須 gate に昇格** する
# (docs/PYTHON_MIGRATION_PLAN.md Phase 6a 参照)。Phase 6b で mjs harness 削除に
# 伴い本 workflow は retire する。
#
# 実行時間: ~1-2 分 (oracle 生成のみ、pytest は走らせない)。
#
# 本 workflow の run: は静的 command のみで、github.event.* 等の untrusted
# input を一切参照しない (schedule / workflow_dispatch のみ trigger)。

on:
  schedule:
    # 毎日 UTC 02:00 (JST 11:00) に実行。ubuntu-latest の runner が空いている
    # 時間帯を狙う (GitHub Actions 混雑ピークを避ける)。
    - cron: '0 2 * * *'
  workflow_dispatch:
    # 手動 trigger も可能 (Phase 6a 準備時の事前確認用)。

permissions:
  contents: read

jobs:
  oracle-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/py
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Node deps
        working-directory: ${{ github.workspace }}
        run: npm ci
      - name: Generate today's oracle JSONL
        # 今日の mjs oracle 出力を生成して sha256 一覧を取る。
        run: |
          node tools/emit_corpus_oracle.mjs --out .oracle_today.jsonl
          wc -l .oracle_today.jsonl
      - name: Upload today's oracle
        # artifact 経由で過去 7 日分の oracle snapshot を追跡可能にする。
        # Phase 6a で committed golden に移行した段階では本 step は不要になる。
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-oracle-jsonl
          path: scripts/py/.oracle_today.jsonl
          retention-days: 7
      # NOTE: Phase 5 期間中は committed golden fixture がまだ存在しないため、
      # 現段階では「生成できたか」だけを検証する (upload した artifact を後続
      # 実行と手動比較する運用)。Phase 6a PR で committed golden との diff 比較
      # step を追加して、差分があったら fail する必須 gate に昇格させる。

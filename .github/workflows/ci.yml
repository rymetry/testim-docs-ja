name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  python-fast:
    # PR B (Phase 5 CI 高速化): 旧 ``python-test`` を分割した fast feedback gate。
    # ruff / format / mypy / 単体 + conformance fast tests (``not corpus`` /
    # ``not slow`` / ``not cutover`` / ``not parity_smoke``)。288-page corpus +
    # align batch + full-repo smoke は ``python-corpus`` / nightly job に分離した
    # (docs/PYTHON_MIGRATION_PLAN.md 参照)。
    # Node は ``not corpus`` scope の conformance 一部が mjs harness を呼ぶため
    # 必要 (Phase 6b cutover で削除予定)。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/py
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Node deps
        # conformance harness (scripts/py/conformance/harness.mjs) が
        # scripts/lib/project.mjs 経由で npm パッケージ ``gray-matter`` を
        # import するため、Python テスト実行前に node_modules を解決する。
        working-directory: ${{ github.workspace }}
        run: npm ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: scripts/py/.python-version
      - name: Install uv
        # astral-sh/setup-uv で uv.lock keyed cache を効かせて dep 解決を高速化
        # (従来の pip install uv==0.11.7 → setup-uv に移行した PR B 改善)。
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6
        with:
          version: '0.11.7'
          enable-cache: true
          cache-dependency-glob: 'scripts/py/uv.lock'
      - name: Sync Python deps
        run: uv sync --all-extras
      - name: Check en_source_patches JSON is in sync with mjs registry
        # dual-source-of-truth の drift 検出。mjs 側 registry を編集したら
        # `npm run regen:py-patches` を実行して JSON を再生成する必要がある。
        working-directory: ${{ github.workspace }}
        run: node scripts/py/tools/regen_en_source_patches.mjs --check
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Ruff format check
        run: uv run ruff format --check src tests
      - name: mypy
        run: uv run mypy src
      - name: pytest (fast)
        # default addopts の 7 marker (``not corpus and not slow and not
        # cutover and not parity_smoke and not recall and not boundary and
        # not real_repo``) を yaml 側で **明示的に重ねて指定**。重い gate は
        # nightly 側で run する:
        #
        #   - ``parity_smoke`` (CI 実測 ~19 分) / ``recall`` / ``boundary`` /
        #     ``real_repo`` → ``nightly-python-oracle.yml``
        #     (``parity-smoke`` / ``python-quality-full``)
        #   - ``corpus`` → ``python-corpus`` (同 CI yaml 内 job)
        #   - ``slow`` / ``cutover`` → local / Phase 6b 手動 run
        #
        # ``--durations=30`` で top 30 の実効時間を毎回出し、fast gate 内の
        # 新規律速を早期検知する (marker 移設後の fast gate 内で潜在的に重い
        # test が沈む事故を防ぐ defense in depth)。
        #
        # この ``run:`` は静的 pytest command のみで untrusted input を
        # 含まないため command injection リスクは無い。
        run: uv run pytest -m 'not corpus and not slow and not cutover and not parity_smoke and not recall and not boundary and not real_repo' --cov=testim_parity --cov-report=term-missing --durations=30
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-coverage
          path: scripts/py/.coverage
          # ``.coverage`` は dot-prefixed の hidden file。upload-artifact@v4
          # は default で hidden file を skip するため、この flag を付けないと
          # "No files were found" で artifact が空になる (PR #386 round 3 で
          # 発覚した bug)。pytest-cov が ``scripts/py/.coverage`` を生成する
          # contract は維持する。
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  python-corpus:
    # PR B で新設した 288-page corpus conformance gate。segments_en + turndown
    # の full parametrized test を pytest-xdist ``-n auto --dist load`` で並列
    # 実行する (8 worker 実測 ~10s、目標 2:30 を大幅下回り)。
    #
    # Phase 6a 以降: oracle は main にある committed golden
    # (``scripts/py/tests/conformance/__oracle__/corpus_golden.jsonl``) を使う。
    # env var / node subprocess 不要なので xdist worker でも stable。
    #
    # Drift check (本 job 内 step): mjs で live oracle を再生成して committed
    # golden と byte-identical 一致するか確認する。mjs lib を変更したのに
    # committed golden を regenerate し忘れた PR を必ず fail させる required gate
    # として機能する (docs/PYTHON_MIGRATION_PLAN.md Phase 6a 節参照、Codex
    # review #1 「nightly は required gate にならない」への対応)。
    #
    # align 288-matrix は ``slow`` marker 側で serial run されるため本 job には
    # 含まない (Phase 6b で golden 化予定、plan doc Phase 5 CI 高速化節参照)。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/py
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Node deps
        # emit_corpus_oracle.mjs が scripts/lib/* を import する経路で
        # gray-matter 等の npm パッケージが要る (drift check step で必要)。
        working-directory: ${{ github.workspace }}
        run: npm ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: scripts/py/.python-version
      - name: Install uv
        # astral-sh/setup-uv で uv.lock keyed cache を効かせて dep 解決を高速化。
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6
        with:
          version: '0.11.7'
          enable-cache: true
          cache-dependency-glob: 'scripts/py/uv.lock'
      - name: Sync Python deps
        run: uv sync --all-extras
      - name: Oracle drift check (live mjs + sha256 TSV vs committed golden)
        # 2 段階 drift check:
        #   1) live mjs JSONL vs committed JSONL (mjs authority の drift 検出)
        #   2) summarize(committed JSONL) vs committed sha256 TSV (PR #387
        #      review P2-1 対応、committed TSV が stale なまま merge される
        #      のを防ぐ)
        # どちらも fail-loud で PR を block する required gate。Phase 6b で
        # mjs 削除時に本 step も retire 予定。
        #
        # 静的 pytest / node command のみで untrusted input を含まないため
        # command injection リスクは無い。
        run: |
          GOLDEN_JSONL=tests/conformance/__oracle__/corpus_golden.jsonl
          GOLDEN_TSV=tests/conformance/__oracle__/corpus_golden.sha256.tsv

          # Step 1: live mjs output vs committed JSONL
          node tools/emit_corpus_oracle.mjs --out .corpus_live.jsonl --suite segments_en,turndown
          if ! diff -q .corpus_live.jsonl "$GOLDEN_JSONL"; then
            echo ""
            echo "::error::Oracle drift detected: mjs live output != committed golden JSONL."
            echo "mjs lib or scripts/lib/* was changed without regenerating the committed golden."
            echo "Run locally (from repo root):"
            echo "  node scripts/py/tools/emit_corpus_oracle.mjs \\"
            echo "    --out scripts/py/tests/conformance/__oracle__/corpus_golden.jsonl \\"
            echo "    --suite segments_en,turndown"
            echo "  node scripts/py/tools/summarize_corpus_oracle.mjs \\"
            echo "    --in scripts/py/tests/conformance/__oracle__/corpus_golden.jsonl \\"
            echo "    --out scripts/py/tests/conformance/__oracle__/corpus_golden.sha256.tsv"
            echo "and commit the regenerated fixture in the same PR."
            exit 1
          fi

          # Step 2: summarize(committed JSONL) vs committed TSV.
          # 誰かが committed JSONL を regenerate したが TSV を regen し忘れると
          # Phase 6b の debug/review 用 hash manifest が stale になるため block。
          node tools/summarize_corpus_oracle.mjs --in "$GOLDEN_JSONL" --out .corpus_live.sha256.tsv
          if ! diff -q .corpus_live.sha256.tsv "$GOLDEN_TSV"; then
            echo ""
            echo "::error::Oracle sha256 TSV drift: committed JSONL hashes != committed TSV."
            echo "The sha256 TSV manifest is stale relative to the committed JSONL."
            echo "Run locally (from repo root) to regenerate TSV:"
            echo "  node scripts/py/tools/summarize_corpus_oracle.mjs \\"
            echo "    --in scripts/py/tests/conformance/__oracle__/corpus_golden.jsonl \\"
            echo "    --out scripts/py/tests/conformance/__oracle__/corpus_golden.sha256.tsv"
            exit 1
          fi
      - name: pytest (corpus)
        # xdist ``-n auto --dist load`` で 576 parametrized test を worker 間に
        # 動的分散する。stdout interleave 対策として ``--tb=short``
        # + ``--junitxml`` artifact を併用する。
        # conftest.py の loader fixture が committed golden を最優先するため
        # env var は不要。本 step は static pytest command のみで command
        # injection リスクは無い。
        run: uv run pytest -m corpus -n auto --dist load --tb=short --junitxml=corpus-junit.xml
      - name: Upload corpus junit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: corpus-junit
          path: scripts/py/corpus-junit.xml
          if-no-files-found: ignore
          retention-days: 7

  parity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Sticky PR comment (Phase B Task 4). PR comments route through the
      # issues REST endpoint (`github.rest.issues.{list,create,update,delete}Comment`),
      # so `issues: write` alone is sufficient — `pull-requests: write` was
      # previously granted but unused (Codex C5). No untrusted event input is
      # interpolated into shell/scripts — the comment body is built from
      # upstream-recovery-status.json (generated in-run) and static text.
      issues: write
    concurrency:
      # Serialise the sticky comment upsert per PR so successive pushes
      # don't race a delete+create pair.
      group: parity-upstream-recovery-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Python setup required because the Render step below delegates to
      # testim_parity.detection.render_upstream_recovery_comment (Phase 4
      # migration, docs/PYTHON_MIGRATION_PLAN.md L721-728). The rest of the
      # job still uses mjs until Phase 6 atomic cutover.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: scripts/py/.python-version
      - name: Install uv
        run: pip install 'uv==0.11.7'
      - name: Sync Python deps
        working-directory: scripts/py
        run: uv sync --all-extras
      - name: Check source parity
        run: npm run check:parity
      - name: Upload parity results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parity-check-status
          path: parity-check-status.json
          retention-days: 7

      - name: Check upstream recovery (non-blocking)
        # Phase B (Task 4): standalone aggregator; exits 0 unconditionally.
        # Consumers decide via the JSON artifact.
        if: always()
        continue-on-error: true
        run: npm run check:upstream-recovery

      - name: Upload upstream recovery status
        if: always() && hashFiles('upstream-recovery-status.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-recovery-status
          path: upstream-recovery-status.json
          retention-days: 7

      - name: Render upstream recovery sticky comment body
        # Delegates markdown rendering to
        # testim_parity.detection.render_upstream_recovery_comment, which
        # imports render_upstream_recovery_sticky_comment from
        # testim_parity.detection_reports. This eliminates logic duplication
        # between the CI step and the Python detection_reports module (same
        # contract as the mjs predecessor tracked in PR #363). The script
        # writes upstream-recovery-comment.md when signals exist and prints
        # `has_signals=true|false` on stdout for the upsert step below.
        #
        # Phase 4 switch (docs/PYTHON_MIGRATION_PLAN.md L721-728): mjs
        # entrypoint scripts/detection/render_upstream_recovery_comment.mjs
        # replaced by the Python module. The Python default for root_dir is
        # testim_parity.project.ROOT_DIR so running from scripts/py still
        # reads/writes the artifacts at the repo root.
        id: render_upstream_recovery_comment
        if: >-
          always() && github.event_name == 'pull_request'
          && hashFiles('upstream-recovery-status.json') != ''
        continue-on-error: true
        working-directory: scripts/py
        run: |
          uv run python -m testim_parity.detection.render_upstream_recovery_comment >> "$GITHUB_OUTPUT"

      - name: Sticky PR comment — upstream recovery (upsert)
        # Idempotent upsert via hidden marker. The body was rendered by the
        # previous step so this inline script only handles the GitHub API
        # calls (list / update / create / delete). All error paths are
        # caught so a transient API failure does not mark the parity job
        # as failed (the comment is informational only).
        if: >-
          always() && github.event_name == 'pull_request'
          && hashFiles('upstream-recovery-status.json') != ''
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          HAS_SIGNALS: ${{ steps.render_upstream_recovery_comment.outputs.has_signals }}
        with:
          script: |
            try {
              const fs = require('fs');
              const MARKER = '<!-- upstream-recovery: sticky -->';
              const hasSignals = process.env.HAS_SIGNALS === 'true';

              // Find any existing sticky comment. Cap per_page at 100 and
              // stop as soon as we locate the marker — PRs with a very long
              // comment history should not fan out to hundreds of API calls.
              let existing = null;
              for await (const { data: page } of github.paginate.iterator(
                github.rest.issues.listComments,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  per_page: 100,
                },
              )) {
                existing = page.find((c) => c.body && c.body.includes(MARKER));
                if (existing) break;
              }

              if (!hasSignals) {
                // No stale/overdue signals — delete any prior sticky comment.
                if (existing) {
                  await github.rest.issues.deleteComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: existing.id,
                  });
                }
                return;
              }

              // Signals present → read pre-rendered body and upsert.
              const body = fs.readFileSync('upstream-recovery-comment.md', 'utf8');

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            } catch (err) {
              // Non-blocking: a transient GitHub API failure (rate-limit /
              // network / permissions hiccup) must not mark the parity job
              // as failed. Surface via core.warning so reviewers can see it
              // in the Actions log, but do not re-throw.
              core.warning(
                `Sticky upstream-recovery comment upsert failed: ${err.message}`,
              );
            }

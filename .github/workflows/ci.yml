name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Markdown / docs / Ruff / Python format / mypy を連結するため
    # Node と Python の両方が必要。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Enable pinned npm
        run: |
          corepack enable npm
          npm --version
      - name: Cache npm downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-npm-
      - run: npm ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: scripts/python/.python-version
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6
        with:
          version: '0.11.7'
          enable-cache: true
          cache-dependency-glob: 'scripts/python/uv.lock'
      - name: Sync Python deps
        working-directory: scripts/python
        run: uv sync --locked --all-extras
      - run: npm run lint

  test:
    # scripts/__tests__/*.test.mjs を glob で実行する Node-only regression guard。
    # Python テストは python-fast / python-corpus で独立に実行する。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Enable pinned npm
        run: |
          corepack enable npm
          npm --version
      - name: Cache npm downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-npm-
      - run: npm ci
      - run: npm run test:mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Enable pinned npm
        run: |
          corepack enable npm
          npm --version
      - name: Cache npm downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-npm-
      - run: npm ci
      - name: Build static site
        run: npm run build

  build-ssr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Enable pinned npm
        run: |
          corepack enable npm
          npm --version
      - name: Cache npm downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-npm-
      - run: npm ci
      - name: Build Vercel SSR site with Basic Auth
        run: npm run build
        env:
          BASIC_AUTH_ENABLED: 'true'

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Enable pinned npm
        run: |
          corepack enable npm
          npm --version
      - name: Cache npm downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-npm-
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run production E2E tests
        run: npm run test:e2e:build
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  python-fast:
    # Python test の fast-feedback gate。Ruff / format / mypy は lint job の
    # ``npm run lint`` に集約し、local と CI で同じ command を使う。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/python
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: scripts/python/.python-version
      - name: Install uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6
        with:
          version: '0.11.7'
          enable-cache: true
          cache-dependency-glob: 'scripts/python/uv.lock'
      - name: Sync Python deps
        run: uv sync --locked --all-extras
      - name: pytest (fast)
        # default addopts (6 marker exclude) を yaml 側で **明示的に重ねて指定** し
        # silent 無効化を防ぐ defense in depth。``slow`` marker は Phase 6b cutover
        # で retire 済 (align が corpus marker に合流した)。
        run: uv run pytest -m 'not corpus and not cutover and not parity_smoke and not recall and not boundary and not real_repo' --cov=testim_parity --cov-report=term-missing --durations=30
      - name: pytest (cutover gate)
        # Phase 6b cutover required step: ``_PY_XFAIL_SLUGS`` / ``_PY_EXTRACTOR_DRIFT_SLUGS``
        # 等の exclusion frozenset が empty であることを assert する self-enforcing gate。
        # ``-o addopts=`` で default addopts を override しないと ``cutover`` marker
        # が skip される (Codex review #4 対応)。
        run: uv run pytest -o addopts= -m cutover
      - name: pytest (recall / boundary / real_repo — required)
        # Phase 6b cutover round-2 review P2 対応: recall (mutation corpus),
        # boundary (segment count regressions), real_repo (slug-level parity
        # smoke) の 3 marker は local で 15-20s で完走する軽量な品質 gate。
        # pyproject.toml docstring が「Phase 6b で required 昇格」と謳っていた
        # が CI YAML に step が無く nightly のみだったため、PR 毎に block
        # できるよう required step として昇格させる。``-o addopts=`` で
        # default exclusion を override して marker を解禁する。
        run: uv run pytest -o addopts= -m 'recall or boundary or real_repo' --tb=short --durations=30
      - name: en_source_patches schema validation
        # Phase 6b cutover round-2 review P2 対応: _en_source_patches_data.json
        # は mjs source 削除後 Python の sole source-of-truth なので、patch 編集時の
        # schema 違反 (defectClass allowlist / ISO date / id uniqueness 等) を
        # CI で catch する。production JSON 34 patches の validation が 0.1s 弱。
        run: uv run python -m testim_parity.tools.validate_en_source_patches
      - name: mjs consumer audit
        # 許可 2 asset 以外の mjs / cjs 参照が
        # package.json / .github / scripts 配下に残っていないことを assert する
        # allow-list:
        #   - .github/scripts/sync-detection-issues.cjs  (Phase 6.1 scope)
        #   - scripts/__tests__/sync_detection_issues.test.mjs
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/audit-mjs-consumers.sh
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-coverage
          path: scripts/python/.coverage
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  python-corpus:
    # Phase 6b cutover: mjs 削除に伴い "live mjs vs committed" drift check step は
    # retire。committed golden が唯一の authority なので、PR CI で確認すべき drift は:
    #   - committed JSONL を summarize した結果が committed TSV と一致するか
    #     (誰かが JSONL だけ regen して TSV を忘れたら block)
    # これは安価 (node 不要) なので本 job に残す。``corpus`` marker は segments_en /
    # turndown / align を合流した 864 test を xdist ``-n auto --dist load`` で並列実行。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/python
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: scripts/python/.python-version
      - name: Install uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6
        with:
          version: '0.11.7'
          enable-cache: true
          cache-dependency-glob: 'scripts/python/uv.lock'
      - name: Sync Python deps
        run: uv sync --locked --all-extras
      - name: Oracle sha256 TSV drift check
        # summarize(committed JSONL) vs committed TSV。committed golden の tamper
        # あるいは TSV regen 忘れを block する (PR #387 review P2-1 対応、
        # Phase 6b でも引き続き required)。
        run: |
          GOLDEN_JSONL=tests/conformance/__oracle__/corpus_golden.jsonl
          GOLDEN_TSV=tests/conformance/__oracle__/corpus_golden.sha256.tsv
          uv run python -m testim_parity.tools.summarize_corpus_oracle --in "$GOLDEN_JSONL" --out .corpus_live.sha256.tsv
          if ! diff -q .corpus_live.sha256.tsv "$GOLDEN_TSV"; then
            echo "::error::Oracle sha256 TSV drift: committed JSONL hashes != committed TSV."
            echo "Run locally to regen TSV:"
            echo "  npm run test:py:corpus:regen"
            exit 1
          fi
      - name: pytest (corpus)
        run: uv run pytest -m corpus -n auto --dist load --tb=short --junitxml=corpus-junit.xml
      - name: Upload corpus junit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: corpus-junit
          path: scripts/python/corpus-junit.xml
          if-no-files-found: ignore
          retention-days: 7

  parity:
    # Phase 6b cutover: ``npm run check:parity`` は既に Python CLI にぶら下がって
    # いる (package.json の rewire 済) ため、本 job は Python 経由で動く。
    # ``check:upstream-recovery`` / sticky comment も Python を呼ぶ。
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Sticky PR comment (Phase B Task 4). PR comments route through the
      # issues REST endpoint, so `issues: write` alone is sufficient.
      issues: write
    concurrency:
      group: parity-upstream-recovery-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Enable pinned npm
        run: |
          corepack enable npm
          npm --version
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: scripts/python/.python-version
      - name: Install uv
        run: pip install 'uv==0.11.7'
      - name: Sync Python deps
        working-directory: scripts/python
        run: uv sync --locked --all-extras
      - name: Check source parity
        run: npm run check:parity
      - name: Upload parity results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parity-check-status
          path: parity-check-status.json
          retention-days: 7

      - name: Check upstream recovery (non-blocking)
        if: always()
        continue-on-error: true
        run: npm run check:upstream-recovery

      - name: Upload upstream recovery status
        if: always() && hashFiles('upstream-recovery-status.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-recovery-status
          path: upstream-recovery-status.json
          retention-days: 7

      - name: Render upstream recovery sticky comment body
        id: render_upstream_recovery_comment
        if: >-
          always() && github.event_name == 'pull_request'
          && hashFiles('upstream-recovery-status.json') != ''
        continue-on-error: true
        working-directory: scripts/python
        run: |
          uv run python -m testim_parity.detection.render_upstream_recovery_comment >> "$GITHUB_OUTPUT"

      - name: Sticky PR comment — upstream recovery (upsert)
        if: >-
          always() && github.event_name == 'pull_request'
          && hashFiles('upstream-recovery-status.json') != ''
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          HAS_SIGNALS: ${{ steps.render_upstream_recovery_comment.outputs.has_signals }}
        with:
          script: |
            try {
              const fs = require('fs');
              const MARKER = '<!-- upstream-recovery: sticky -->';
              const hasSignals = process.env.HAS_SIGNALS === 'true';

              let existing = null;
              for await (const { data: page } of github.paginate.iterator(
                github.rest.issues.listComments,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  per_page: 100,
                },
              )) {
                existing = page.find((c) => c.body && c.body.includes(MARKER));
                if (existing) break;
              }

              if (!hasSignals) {
                if (existing) {
                  await github.rest.issues.deleteComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: existing.id,
                  });
                }
                return;
              }

              const body = fs.readFileSync('upstream-recovery-comment.md', 'utf8');

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            } catch (err) {
              core.warning(
                `Sticky upstream-recovery comment upsert failed: ${err.message}`,
              );
            }

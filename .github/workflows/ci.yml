name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  python-fast:
    # PR B (Phase 5 CI 高速化): 旧 ``python-test`` を分割した fast feedback gate。
    # ruff / format / mypy / 単体 + conformance fast tests (``not corpus`` /
    # ``not slow`` / ``not cutover`` / ``not parity_smoke``)。288-page corpus +
    # align batch + full-repo smoke は ``python-corpus`` / ``python-parity-smoke``
    # に分離した (docs/PYTHON_MIGRATION_PLAN.md 参照)。
    # Node は ``not corpus`` scope の conformance 一部が mjs harness を呼ぶため
    # 必要 (Phase 6b cutover で削除予定)。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/py
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Node deps
        # conformance harness (scripts/py/conformance/harness.mjs) が
        # scripts/lib/project.mjs 経由で npm パッケージ ``gray-matter`` を
        # import するため、Python テスト実行前に node_modules を解決する。
        working-directory: ${{ github.workspace }}
        run: npm ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: scripts/py/.python-version
      - name: Install uv
        # uv のバージョンを固定して、将来の破壊的変更が突然 CI を壊すリスクを
        # 抑える。bump 時は手動で SHA / テストを回してから上げる。
        run: pip install 'uv==0.11.7'
      - name: Sync Python deps
        run: uv sync --all-extras
      - name: Check en_source_patches JSON is in sync with mjs registry
        # dual-source-of-truth の drift 検出。mjs 側 registry を編集したら
        # `npm run regen:py-patches` を実行して JSON を再生成する必要がある。
        working-directory: ${{ github.workspace }}
        run: node scripts/py/tools/regen_en_source_patches.mjs --check
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Ruff format check
        run: uv run ruff format --check src tests
      - name: mypy
        run: uv run mypy src
      - name: pytest (fast)
        # default addopts (``-m 'not corpus and not slow and not cutover and
        # not parity_smoke'``) を yaml 側で **明示的に重ねて指定**。``parity_smoke``
        # は PR A で追加した full-repo smoke で ``python-parity-smoke`` job が
        # 独立に run する。この ``run:`` は静的 pytest command のみで untrusted
        # input を含まないため command injection リスクは無い。
        run: uv run pytest -m 'not corpus and not slow and not cutover and not parity_smoke' --cov=testim_parity --cov-report=term-missing
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-coverage
          path: scripts/py/.coverage
          if-no-files-found: ignore
          retention-days: 7

  python-parity-smoke:
    # PR A で追加した full-repo smoke (``check_source_parity`` を real ROOT_DIR
    # で走らせて schema / maskCoverage shape を pin する)。Phase 5 coexistence
    # 中は ~5 分かかるため ``python-fast`` から分離。Phase 6b atomic cutover で
    # Python-only gate になる段階で本 job は恒常化する。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/py
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: scripts/py/.python-version
      - name: Install uv
        run: pip install 'uv==0.11.7'
      - name: Sync Python deps
        run: uv sync --all-extras
      - name: pytest (parity_smoke)
        # ``-m 'parity_smoke and not cutover'``: Phase 5 coexistence 中は
        # cutover-marked 5-counter test は fail するため除外。Phase 6b で外す。
        # run: 内は静的 pytest command のみで untrusted input を含まないため
        # command injection リスクは無い。
        run: uv run pytest -m 'parity_smoke and not cutover' --tb=short

  python-corpus:
    # PR B で新設した 288-page corpus conformance gate。segments_en + turndown
    # の full parametrized test を pytest-xdist ``-n auto --dist load`` で並列
    # 実行する (8 worker 実測 ~10s、目標 2:30 を大幅下回り)。oracle は
    # ``node scripts/py/tools/emit_corpus_oracle.mjs`` が事前生成し、全 worker
    # が ``TESTIM_CORPUS_EXPECTED_JSONL`` 環境変数経由で同じ JSONL を読む
    # (silent な N-way harness 再呼び出しを防ぐ契約)。align 288-matrix は
    # ``slow`` marker 側で serial run されるため本 job には含まない (plan doc
    # Phase 5 CI 高速化節参照)。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/py
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Node deps
        # emit_corpus_oracle.mjs が scripts/lib/* を import する経路で
        # gray-matter 等の npm パッケージが要る。
        working-directory: ${{ github.workspace }}
        run: npm ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: scripts/py/.python-version
      - name: Install uv
        run: pip install 'uv==0.11.7'
      - name: Sync Python deps
        run: uv sync --all-extras
      - name: Generate corpus oracle JSONL
        # 288 page × 2 suite (segments_en + turndown) の expected を mjs
        # authority で 1 回だけ emit。atomic temp+rename で partial 状態を
        # 残さない (emit_corpus_oracle.mjs docstring 参照)。
        run: node tools/emit_corpus_oracle.mjs --out .corpus_expected.jsonl --suite segments_en,turndown
      - name: pytest (corpus)
        # xdist ``-n auto --dist load`` で 576 parametrized test を worker 間に
        # 動的分散する。stdout interleave 対策として ``--tb=short``
        # + ``--junitxml`` artifact を併用する。
        # ``TESTIM_CORPUS_EXPECTED_JSONL`` は **絶対パス** 必須 (conftest.py の
        # loader fixture 契約、相対 path は xdist worker cwd semantics を壊す)。
        # run: 内は静的 pytest command のみで untrusted input を含まないため
        # command injection リスクは無い。
        env:
          TESTIM_CORPUS_EXPECTED_JSONL: ${{ github.workspace }}/scripts/py/.corpus_expected.jsonl
        run: uv run pytest -m corpus -n auto --dist load --tb=short --junitxml=corpus-junit.xml
      - name: Upload corpus junit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: corpus-junit
          path: scripts/py/corpus-junit.xml
          if-no-files-found: ignore
          retention-days: 7

  parity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Sticky PR comment (Phase B Task 4). PR comments route through the
      # issues REST endpoint (`github.rest.issues.{list,create,update,delete}Comment`),
      # so `issues: write` alone is sufficient — `pull-requests: write` was
      # previously granted but unused (Codex C5). No untrusted event input is
      # interpolated into shell/scripts — the comment body is built from
      # upstream-recovery-status.json (generated in-run) and static text.
      issues: write
    concurrency:
      # Serialise the sticky comment upsert per PR so successive pushes
      # don't race a delete+create pair.
      group: parity-upstream-recovery-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Python setup required because the Render step below delegates to
      # testim_parity.detection.render_upstream_recovery_comment (Phase 4
      # migration, docs/PYTHON_MIGRATION_PLAN.md L721-728). The rest of the
      # job still uses mjs until Phase 6 atomic cutover.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: scripts/py/.python-version
      - name: Install uv
        run: pip install 'uv==0.11.7'
      - name: Sync Python deps
        working-directory: scripts/py
        run: uv sync --all-extras
      - name: Check source parity
        run: npm run check:parity
      - name: Upload parity results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parity-check-status
          path: parity-check-status.json
          retention-days: 7

      - name: Check upstream recovery (non-blocking)
        # Phase B (Task 4): standalone aggregator; exits 0 unconditionally.
        # Consumers decide via the JSON artifact.
        if: always()
        continue-on-error: true
        run: npm run check:upstream-recovery

      - name: Upload upstream recovery status
        if: always() && hashFiles('upstream-recovery-status.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-recovery-status
          path: upstream-recovery-status.json
          retention-days: 7

      - name: Render upstream recovery sticky comment body
        # Delegates markdown rendering to
        # testim_parity.detection.render_upstream_recovery_comment, which
        # imports render_upstream_recovery_sticky_comment from
        # testim_parity.detection_reports. This eliminates logic duplication
        # between the CI step and the Python detection_reports module (same
        # contract as the mjs predecessor tracked in PR #363). The script
        # writes upstream-recovery-comment.md when signals exist and prints
        # `has_signals=true|false` on stdout for the upsert step below.
        #
        # Phase 4 switch (docs/PYTHON_MIGRATION_PLAN.md L721-728): mjs
        # entrypoint scripts/detection/render_upstream_recovery_comment.mjs
        # replaced by the Python module. The Python default for root_dir is
        # testim_parity.project.ROOT_DIR so running from scripts/py still
        # reads/writes the artifacts at the repo root.
        id: render_upstream_recovery_comment
        if: >-
          always() && github.event_name == 'pull_request'
          && hashFiles('upstream-recovery-status.json') != ''
        continue-on-error: true
        working-directory: scripts/py
        run: |
          uv run python -m testim_parity.detection.render_upstream_recovery_comment >> "$GITHUB_OUTPUT"

      - name: Sticky PR comment — upstream recovery (upsert)
        # Idempotent upsert via hidden marker. The body was rendered by the
        # previous step so this inline script only handles the GitHub API
        # calls (list / update / create / delete). All error paths are
        # caught so a transient API failure does not mark the parity job
        # as failed (the comment is informational only).
        if: >-
          always() && github.event_name == 'pull_request'
          && hashFiles('upstream-recovery-status.json') != ''
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          HAS_SIGNALS: ${{ steps.render_upstream_recovery_comment.outputs.has_signals }}
        with:
          script: |
            try {
              const fs = require('fs');
              const MARKER = '<!-- upstream-recovery: sticky -->';
              const hasSignals = process.env.HAS_SIGNALS === 'true';

              // Find any existing sticky comment. Cap per_page at 100 and
              // stop as soon as we locate the marker — PRs with a very long
              // comment history should not fan out to hundreds of API calls.
              let existing = null;
              for await (const { data: page } of github.paginate.iterator(
                github.rest.issues.listComments,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  per_page: 100,
                },
              )) {
                existing = page.find((c) => c.body && c.body.includes(MARKER));
                if (existing) break;
              }

              if (!hasSignals) {
                // No stale/overdue signals — delete any prior sticky comment.
                if (existing) {
                  await github.rest.issues.deleteComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: existing.id,
                  });
                }
                return;
              }

              // Signals present → read pre-rendered body and upsert.
              const body = fs.readFileSync('upstream-recovery-comment.md', 'utf8');

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            } catch (err) {
              // Non-blocking: a transient GitHub API failure (rate-limit /
              // network / permissions hiccup) must not mark the parity job
              // as failed. Surface via core.warning so reviewers can see it
              // in the Actions log, but do not re-throw.
              core.warning(
                `Sticky upstream-recovery comment upsert failed: ${err.message}`,
              );
            }

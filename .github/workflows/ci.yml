name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Check source parity
        id: parity
        run: |
          set +e
          npm run check:parity
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Generate detection summary
        if: always()
        run: npm run check:summary
      - name: Publish step summary
        if: always() && hashFiles('docs-update-summary.md') != ''
        run: cat docs-update-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload parity results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-check-results
          path: |
            parity-check-status.json
            docs-update-summary.md
          retention-days: 7
      - name: Fail on parity issues
        if: steps.parity.outputs.exit_code != '0'
        run: exit 1

[project]
name = "testim-parity"
version = "0.0.1"
description = "Python port of the testim-docs-ja parity/sync tooling"
requires-python = ">=3.12"
dependencies = [
  # Structural-contract libraries: pin compatible-release (~=) upper bounds so
  # a silent ``uv lock --upgrade`` cannot change BS4/lxml tree reparenting
  # or markdown-it-py token shape between migration phases. Conformance
  # tests would catch drift, but early warning via a bounded lockfile is
  # cheaper. Bump these deliberately with a re-run of the 288-page matrix.
  "beautifulsoup4~=4.12",
  "lxml~=6.0",
  "html5lib~=1.1",
  "markdown-it-py[plugins]~=4.0",
  "httpx>=0.27",
  "pydantic>=2.0",
  "click>=8.0",
  "python-frontmatter>=1.1",
  # Phase 4b: turndown.mjs (HTML→MD 変換) の Python 等価実装で使用。
  # markdownify 自体は default 規則が turndown と異なるため、MarkdownConverter
  # subclass で大部分を override して使う (testim_parity.turndown 参照)。
  "markdownify~=1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  # PR B (Phase 5 CI 高速化): 288-page corpus conformance を slug-parametrized
  # test に分解して worker 間で動的分散する。``-n auto`` + ``--dist load`` で
  # Phase 4b-5 実測 4:17 を ubuntu-latest 4 worker 並列で ~2 分に短縮する想定
  # (docs/PYTHON_MIGRATION_PLAN.md Phase 5 CI 高速化計画 参照)。``[psutil]``
  # extra は worker CPU affinity 検出のため必須 (xdist docs 推奨)。
  "pytest-xdist[psutil]>=3.6",
  "ruff>=0.4",
  "mypy>=1.10",
  # Phase 1 で BS4 / lxml / html5lib を segments_en.py が使い始めるため、
  # 型スタブを導入して mypy strictness を維持する (Phase 0 review N3)。
  # スタブ未導入のままだと ``ignore_missing_imports = true`` を拡張する必要が
  # あり、first-party 側の typo 検出力が落ちる。
  "types-beautifulsoup4~=4.12",
  "types-html5lib~=1.1",
  "lxml-stubs~=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testim_parity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  # Full-repo structural boundary benchmark (``test_segments_boundary.py``
  # + ``test_clean_page_fixtures.py``). Every test walks the representative
  # manifest × ``CLEAN_PAGE_SLUGS`` through ``_analyze_page`` /
  # ``_run_structure_comparator``; running in the ``python-fast`` PR gate
  # would add minutes per PR. Excluded from default addopts, exercised by
  # the ``python-quality-full`` nightly job (``nightly-python-oracle.yml``)
  # and escalated to required in the Phase 6b cutover PR.
  "boundary: boundary stability (score >= 0.95, full-repo manifest walk)",
  # Full-repo mutation recall benchmark (``test_recall.py`` +
  # ``test_baseline_recall.py``). Runs every diff=1 mutation type against
  # every manifest slug — 10+ minute workload. Same ``python-fast``
  # exclusion / nightly escalation contract as ``boundary``.
  "recall: mutation recall (9/9 = 100%, full-repo manifest walk)",
  "integration: full pipeline",
  # 288-page corpus conformance (segments_en + turndown + align 全ページ走査)。
  # PR B (Phase 5 CI 高速化) で slug-parametrize + pytest-xdist ``-n auto
  # --dist load`` で並列化した。Phase 6b cutover で mjs 削除と同時に align を
  # 本 marker に合流させた (committed ``corpus_golden.jsonl`` の ``suite="align"``
  # を load して byte 比較)。``corpus`` は default で CI / local の両方から除外し、
  # pytest-xdist 込みの実行を ``uv run pytest -m corpus -n auto --dist load`` として
  # 別 job (``python-corpus``) で走らせる (docs/PYTHON_MIGRATION_PLAN.md 参照)。
  "corpus: 288-page corpus conformance (segments_en + turndown + align, xdist 対応)",
  # Phase 6 atomic cutover の self-enforcing gate。Phase 5 で port 中に
  # 発覚した Python extractor / align drift を Phase 6 cutover PR で解消したかを
  # auto audit する。``_PY_XFAIL_SLUGS`` / ``_PY_EXTRACTOR_DRIFT_SLUGS`` 等の
  # temporary exclusion frozenset が empty でない限り fail する。Phase 5
  # coexistence 期間は default skip (empty でない前提)、Phase 6 cutover PR で
  # ``uv run pytest -m cutover`` を強制 run して緑確認する。
  "cutover: Phase 6 cutover gate (all drift exclusions must be empty)",
  # PR A (``MaskCoverage`` blocker 修正) の acceptance gate。実 ROOT_DIR に
  # 対して Python ``check_source_parity`` CLI を走らせ、schema / maskCoverage
  # shape を pin する。**CI 実測 ~19 分** (PR #386 round 1 で測定) のため
  # required PR CI からは外し、``.github/workflows/nightly-python-oracle.yml``
  # の ``parity-smoke`` job で毎日 1 回 run する (docs/PYTHON_MIGRATION_PLAN.md
  # 参照)。Phase 6b atomic cutover 後は Python-only gate になり実行時間が
  # 短縮される見込みで、そのタイミングで required CI 再昇格を検討する。
  "parity_smoke: Python check_source_parity full-repo smoke (~19min CI, nightly during Phase 5)",
  # Real-repo snapshot integration benchmarks (``test_structure_fixtures.py``
  # / ``test_source_usability_fixtures.py``). 実 EN HTML snapshot + JA
  # markdown を load して align + structure comparator / source-usability
  # detector を end-to-end で走らせる。CI 実測で 1 test あたり 28-83s かかる
  # ため default PR gate には乗らない。nightly ``python-quality-full`` で
  # ``recall`` / ``boundary`` と同 job で run し、Phase 6b cutover PR で
  # required 昇格する。boundary とは semantic が分かれる ("real repo との
  # 実 integration" vs "structure stability score") ため独立 marker として
  # 導入した。
  "real_repo: real-repo snapshot integration benchmarks (real EN HTML / JA md)",
]
# default addopts は 6 marker (corpus / cutover / parity_smoke / recall /
# boundary / real_repo) を **local でも CI でも** 除外する。PR feedback loop に
# 乗る pytest は単位時間で走る必要があり、full-repo manifest benchmark
# (~10 min〜1 時間オーダー) や real-repo integration (~1 test 80+s) は全て
# opt-in に寄せる方針。Phase 6b cutover で ``slow`` marker は retire された
# (align conformance が ``corpus`` に合流)。
#
# - ``corpus`` (288-page segments_en + turndown + align conformance, xdist 対応)
#   は ~10s で走る軽量 gate だが ``python-fast`` の coverage 計測とは独立 run
#   したいため別 job ``python-corpus`` で ``uv run pytest -m corpus -n auto
#   --dist load`` として走らせる。
# - ``cutover`` は Phase 6b cutover PR 内で ``uv run pytest -o addopts= -m cutover``
#   を **1 回限り強制 run** する gate。通常は skip のまま、cutover 後は Python
#   drift guard として継続使用。
# - ``parity_smoke`` は PR A で導入した Python ``check_source_parity`` full-repo
#   smoke (CI 実測 ~19 分)。required PR CI では feedback loop を破綻させる
#   ため nightly (``nightly-python-oracle.yml``) に移設した。Phase 6b atomic
#   cutover で Python-only gate の segment として標準化される。
# - ``recall`` (``test_recall.py`` + ``test_baseline_recall.py``) は全 diff=1
#   mutation を全 manifest slug に適用する benchmark。旧 default run では CI
#   実測 24 分以上かかり PR feedback loop を停止させていた。Phase 5 では
#   nightly (``python-quality-full``) のみで走らせ、Phase 6b cutover PR で
#   required に昇格する (docs/PYTHON_MIGRATION_PLAN.md Phase 6b 参照)。
# - ``boundary`` (``test_segments_boundary.py`` + ``test_clean_page_fixtures.py``)
#   は manifest 全ページを構造比較する sentinel 群。``recall`` と同じ扱いで
#   nightly 専用に寄せ、Phase 6b cutover で required に昇格する。
# - ``real_repo`` (``test_structure_fixtures.py`` + ``test_source_usability_fixtures.py``)
#   は real EN snapshot + JA md を end-to-end で走らせる integration。CI
#   実測で single test が 28-83s (parametrize ごと)、single detector test が
#   38s と重く、旧 default pytest で python-fast を 5 分超に押し上げていた。
#   ``recall`` / ``boundary`` と同じく nightly 移設 + Phase 6b 昇格。
#
# CI yaml (``.github/workflows/ci.yml``) でも同等の marker filter を **明示的に
# 重ねて指定** する (この file の変更による silent 無効化を防ぐ defense in depth)。
addopts = "-m 'not corpus and not cutover and not parity_smoke and not recall and not boundary and not real_repo'"

[tool.coverage.report]
# Phase 4b-5 temporary: ``corpus`` marker (288-page matrix conformance) を
# ``python-fast`` job default で skip した結果、288-page matrix が exercise
# していた segments_en / align / turndown 系 path が ``python-fast`` の
# coverage には計上されない。別 job ``python-corpus`` が corpus を走らせるが
# Phase 6b cutover 時点の coverage: ``-o addopts=`` で 7-marker default exclude を
# override して 2653 test を回すと 87.37%。plan doc は 90% を long-term target に
# していたが、pipeline / tools 系の deep-branch coverage を 90% まで押し上げるには
# dedicated test fixture の追加が必要。Phase 6b atomic cutover では 85% を下限 gate
# として pin し、pipeline branch coverage は post-cutover follow-up (docs/PYTHON_MIGRATION_PLAN.md
# Phase 6 gate #1 参照) に回す — cutover の critical path (segments / align / parity /
# mutation recall / lint_docs / check_source_parity) は 90% を超えている。
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# SIM300: "Yoda condition" — in assertions, keeping the SUT on the left reads
# more naturally (`assert actual == expected`), so we disable the fixer.
ignore = ["SIM300"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
# ``ignore_missing_imports`` is **not** set globally — we use per-package
# overrides below so type errors in first-party code (typos in
# ``testim_parity.*`` module paths, etc.) still surface.
packages = ["testim_parity"]
mypy_path = "src"

[[tool.mypy.overrides]]
# Tests can be loose — the conftest factories return Any by design.
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# ``turndown.py`` subclasses ``MarkdownConverter`` whose package lacks stubs.
# Inheriting from Any-typed class + accessing its attrs (``self.options``, nested
# ``DefaultOptions`` / ``Options``) surfaces multiple name-defined / misc errors.
# The module is exercised by conformance + unit tests against mjs turndown, so
# runtime correctness is covered; relax mypy here rather than sprinkle ignores.
module = "testim_parity.turndown"
disable_error_code = ["name-defined", "attr-defined", "no-any-return", "misc"]

[[tool.mypy.overrides]]
# Third-party libraries without type stubs. Keep this list explicit so a
# typo in a first-party import path (``testim_paritty`` etc.) is still
# caught as a missing-import error. Add modules here only after confirming
# they genuinely lack stubs on PyPI (check ``types-*`` packages first).
#
# Phase 1 stub availability check (2026-04-21):
#   - beautifulsoup4 → types-beautifulsoup4 あり (dev extras へ追加)
#   - html5lib → types-html5lib あり (dev extras へ追加、この override から除外)
#   - lxml → lxml-stubs あり (dev extras へ追加)
#   - python-frontmatter → スタブなし、override 維持
#   - markdown-it-py → スタブなし、override 維持 (Phase 2)
#   - mdit_py_plugins → スタブなし、override 維持 (Phase 2)
module = [
  "frontmatter",
  "frontmatter.*",
  "markdown_it",
  "markdown_it.*",
  "mdit_py_plugins",
  "mdit_py_plugins.*",
  "markdownify",
  "markdownify.*",
]
ignore_missing_imports = true

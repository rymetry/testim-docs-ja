[project]
name = "testim-parity"
version = "0.0.1"
description = "Python port of the testim-docs-ja parity/sync tooling"
requires-python = ">=3.12"
dependencies = [
  # Structural-contract libraries: pin compatible-release (~=) upper bounds so
  # a silent ``uv lock --upgrade`` cannot change BS4/lxml tree reparenting
  # or markdown-it-py token shape between migration phases. Conformance
  # tests would catch drift, but early warning via a bounded lockfile is
  # cheaper. Bump these deliberately with a re-run of the 288-page matrix.
  "beautifulsoup4~=4.12",
  "lxml~=6.0",
  "html5lib~=1.1",
  "markdown-it-py[plugins]~=4.0",
  "httpx>=0.27",
  "pydantic>=2.0",
  "click>=8.0",
  "python-frontmatter>=1.1",
  # Phase 4b: turndown.mjs (HTML→MD 変換) の Python 等価実装で使用。
  # markdownify 自体は default 規則が turndown と異なるため、MarkdownConverter
  # subclass で大部分を override して使う (testim_parity.turndown 参照)。
  "markdownify~=1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
  # Phase 1 で BS4 / lxml / html5lib を segments_en.py が使い始めるため、
  # 型スタブを導入して mypy strictness を維持する (Phase 0 review N3)。
  # スタブ未導入のままだと ``ignore_missing_imports = true`` を拡張する必要が
  # あり、first-party 側の typo 検出力が落ちる。
  "types-beautifulsoup4~=4.12",
  "types-html5lib~=1.1",
  "lxml-stubs~=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testim_parity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "boundary: boundary stability (score >= 0.95)",
  "recall: mutation recall (9/9 = 100%)",
  "integration: full pipeline",
  # 288-page matrix conformance (~4 min)。default で除外し、**CI も local も**
  # ``addopts = "-m 'not slow and not cutover'"`` で skip する運用 (Phase 4b-5
  # coexistence)。merge 前に shape drift を検証したい reviewer は local で
  # ``uv run pytest -m slow`` を **明示 run** する。Phase 6 cutover で
  # conformance が golden 化される段階で slow marker は自然退場する。
  # align_288_matrix はアルゴリズム計算が重いため pytest-xdist でも律速 (単一
  # test がシリアル)、slow-marker で opt-in する設計が最善策。
  "slow: 288-page corpus conformance (align + segments_en 全ページ走査)",
  # Phase 6 atomic cutover の self-enforcing gate。Phase 5 で port 中に
  # 発覚した Python extractor / align drift を Phase 6 cutover PR で解消したかを
  # auto audit する。``_PY_XFAIL_SLUGS`` / ``_PY_EXTRACTOR_DRIFT_SLUGS`` 等の
  # temporary exclusion frozenset が empty でない限り fail する。Phase 5
  # coexistence 期間は default skip (empty でない前提)、Phase 6 cutover PR で
  # ``uv run pytest -m cutover`` を強制 run して緑確認する。
  "cutover: Phase 6 cutover gate (all drift exclusions must be empty)",
]
# default addopts は slow / cutover を **local でも CI でも** 除外する。
#
# - ``slow`` (288-page matrix conformance) は ~4 min かかるため CI feedback loop
#   を阻害する。Phase 6 cutover で conformance が golden 化される段階で自然退場。
#   事前 run は reviewer が local で ``uv run pytest -m slow`` を明示実行する運用。
# - ``cutover`` は Phase 6 cutover PR 内で ``uv run pytest -o addopts= -m cutover``
#   を **1 回限り強制 run** する gate。coexistence 期間は skip のまま。
#
# CI yaml (``.github/workflows/ci.yml`` の ``python-test`` job) でも同等の
# ``-m 'not slow and not cutover'`` を **明示的に重ねて指定** する (この file の
# 変更による silent 無効化を防ぐ defense in depth)。
addopts = "-m 'not slow and not cutover'"

[tool.coverage.report]
# Phase 4b-5 temporary: ``slow`` marker (288-page matrix conformance) を CI
# default で skip した結果、288-page matrix が exercise していた segments_en /
# align / turndown 系 path が coverage に計上されず、CI 実効 coverage は ~65-70%
# まで下がる (slow 込み local 実測は 95.60%、Phase 5 完了時点)。
#
# Phase 6 atomic cutover で conformance test 一式を golden snapshot に退場させ、
# slow marker が不要になる段階で ``fail_under = 90`` へ戻す。それまでは
# reviewer が pre-merge に ``uv run pytest -m slow`` で補完する運用契約
# (docs/PYTHON_MIGRATION_PLAN.md Phase 5 実績表 / Phase 6 gate 1 を参照)。
#
# ``fail_under = 65`` は **Phase 5 coexistence 下限値**。CI で slow 除外後も
# 少なくとも 65% は維持する regression guard として機能する (急激な coverage
# 崩壊を検知する下限 gate)。Phase 5 期間中にこの値を変更する場合は plan doc
# 側の coverage 記述も同時に update する契約。
fail_under = 65

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# SIM300: "Yoda condition" — in assertions, keeping the SUT on the left reads
# more naturally (`assert actual == expected`), so we disable the fixer.
ignore = ["SIM300"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
# ``ignore_missing_imports`` is **not** set globally — we use per-package
# overrides below so type errors in first-party code (typos in
# ``testim_parity.*`` module paths, etc.) still surface.
packages = ["testim_parity"]
mypy_path = "src"

[[tool.mypy.overrides]]
# Tests can be loose — the conftest factories return Any by design.
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# ``turndown.py`` subclasses ``MarkdownConverter`` whose package lacks stubs.
# Inheriting from Any-typed class + accessing its attrs (``self.options``, nested
# ``DefaultOptions`` / ``Options``) surfaces multiple name-defined / misc errors.
# The module is exercised by conformance + unit tests against mjs turndown, so
# runtime correctness is covered; relax mypy here rather than sprinkle ignores.
module = "testim_parity.turndown"
disable_error_code = ["name-defined", "attr-defined", "no-any-return", "misc"]

[[tool.mypy.overrides]]
# Third-party libraries without type stubs. Keep this list explicit so a
# typo in a first-party import path (``testim_paritty`` etc.) is still
# caught as a missing-import error. Add modules here only after confirming
# they genuinely lack stubs on PyPI (check ``types-*`` packages first).
#
# Phase 1 stub availability check (2026-04-21):
#   - beautifulsoup4 → types-beautifulsoup4 あり (dev extras へ追加)
#   - html5lib → types-html5lib あり (dev extras へ追加、この override から除外)
#   - lxml → lxml-stubs あり (dev extras へ追加)
#   - python-frontmatter → スタブなし、override 維持
#   - markdown-it-py → スタブなし、override 維持 (Phase 2)
#   - mdit_py_plugins → スタブなし、override 維持 (Phase 2)
module = [
  "frontmatter",
  "frontmatter.*",
  "markdown_it",
  "markdown_it.*",
  "mdit_py_plugins",
  "mdit_py_plugins.*",
  "markdownify",
  "markdownify.*",
]
ignore_missing_imports = true

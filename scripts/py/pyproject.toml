[project]
name = "testim-parity"
version = "0.0.1"
description = "Python port of the testim-docs-ja parity/sync tooling"
requires-python = ">=3.12"
dependencies = [
  # Structural-contract libraries: pin compatible-release (~=) upper bounds so
  # a silent ``uv lock --upgrade`` cannot change BS4/lxml tree reparenting
  # or markdown-it-py token shape between migration phases. Conformance
  # tests would catch drift, but early warning via a bounded lockfile is
  # cheaper. Bump these deliberately with a re-run of the 288-page matrix.
  "beautifulsoup4~=4.12",
  "lxml~=6.0",
  "html5lib~=1.1",
  "markdown-it-py[plugins]~=4.0",
  "httpx>=0.27",
  "pydantic>=2.0",
  "click>=8.0",
  "python-frontmatter>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
  # Phase 1 で BS4 / lxml / html5lib を segments_en.py が使い始めるため、
  # 型スタブを導入して mypy strictness を維持する (Phase 0 review N3)。
  # スタブ未導入のままだと ``ignore_missing_imports = true`` を拡張する必要が
  # あり、first-party 側の typo 検出力が落ちる。
  "types-beautifulsoup4~=4.12",
  "types-html5lib~=1.1",
  "lxml-stubs~=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testim_parity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "boundary: boundary stability (score >= 0.95)",
  "recall: mutation recall (9/9 = 100%)",
  "integration: full pipeline",
]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# SIM300: "Yoda condition" — in assertions, keeping the SUT on the left reads
# more naturally (`assert actual == expected`), so we disable the fixer.
ignore = ["SIM300"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
# ``ignore_missing_imports`` is **not** set globally — we use per-package
# overrides below so type errors in first-party code (typos in
# ``testim_parity.*`` module paths, etc.) still surface.
packages = ["testim_parity"]
mypy_path = "src"

[[tool.mypy.overrides]]
# Tests can be loose — the conftest factories return Any by design.
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Third-party libraries without type stubs. Keep this list explicit so a
# typo in a first-party import path (``testim_paritty`` etc.) is still
# caught as a missing-import error. Add modules here only after confirming
# they genuinely lack stubs on PyPI (check ``types-*`` packages first).
#
# Phase 1 stub availability check (2026-04-21):
#   - beautifulsoup4 → types-beautifulsoup4 あり (dev extras へ追加)
#   - html5lib → types-html5lib あり (dev extras へ追加、この override から除外)
#   - lxml → lxml-stubs あり (dev extras へ追加)
#   - python-frontmatter → スタブなし、override 維持
#   - markdown-it-py → スタブなし、override 維持 (Phase 2)
#   - mdit_py_plugins → スタブなし、override 維持 (Phase 2)
module = [
  "frontmatter",
  "frontmatter.*",
  "markdown_it",
  "markdown_it.*",
  "mdit_py_plugins",
  "mdit_py_plugins.*",
]
ignore_missing_imports = true

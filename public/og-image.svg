        font-family: "Avenir Next", Montserrat, Poppins, "Helvetica Neue", Arial, sans-serif;
        text-anchor: middle;
        font-weight: 500;
      }
      .title {
        font-size: 82px;
        letter-spacing: 1px;
      }
      .subtitle {
        fill: var(--brand-navy-900, #0A243B);
        font-size: 37px;
        font-weight: 400;
        letter-spacing: 0.3px;
      }
    </style>
  </defs>
  <metadata>
    Color tokens:

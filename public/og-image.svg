    --brand-blue-600: #0A66C2
    --brand-blue-400: #1EA0FF
    --brand-navy-700: #0E426F
    --brand-navy-900: #0A243B

    Editable groups:
    #icon = symbol mark
    #text-title = primary wordmark text
    #text-subtitle = secondary descriptor text
  </metadata>


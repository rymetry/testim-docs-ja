<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1408 768" role="img" aria-labelledby="title desc">
  <title id="title">TESTIM DOCS JA logo</title>
  <desc id="desc">Brand-ready SVG logo with editable text layers and centralized color tokens for Testim Docs JA.</desc>
  <defs>
    <linearGradient id="brand-icon-gradient" x1="514" y1="492" x2="895" y2="110" gradientUnits="userSpaceOnUse">
